user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Эти поля используются общим парсером мониторинга.
    log_format monitoring escape=json
        '{'
        '"time":"$time_iso8601","method":"$request_method","path":"$uri",'
        '"status":$status,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","bytes":$body_bytes_sent,'
        '"host":"$host","ua":"$http_user_agent"'
        '}';

    access_log /dev/stdout monitoring;
    error_log /dev/stderr warn;
    sendfile on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    upstream django {
        zone django_zone 64k;
        server backend:8000 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream asgi {
        zone asgi_zone 64k;
        server backend-asgi:8001 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 2G;

        location ~ /\. {
            deny all;
        }

        location /static/ {
            alias /var/www/static/;
            expires 7d;
        }

        location /media/ {
            alias /var/www/media/;
            expires 1d;
        }

        location /ws/ {
            proxy_pass http://asgi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location / {
            proxy_pass http://django;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 2s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
