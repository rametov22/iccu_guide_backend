name: ${PROJECT_NAME:-iccu-guide}-dev

x-dev-backend: &dev-backend
  build:
    context: .
    dockerfile: ./Dockerfile.dev
  env_file:
    - ./.env
  environment:
    ENVIRONMENT: dev
  volumes:
    - .:/app
    - django-static:/app/backend/static
    - django-media:/app/backend/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  backend:
    <<: *dev-backend
    command: sleep infinity

  backend-asgi:
    <<: *dev-backend
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8001 --reload
    working_dir: /app/backend

  redis:
    image: redis:8
    expose:
      - 6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 5
      timeout: 3s
    restart: unless-stopped

  db:
    image: postgres:17.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 5
      timeout: 3s
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${APP_PORT:-30312}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - django-static:/var/www/static:ro
      - django-media:/var/www/media:ro
    depends_on:
      backend:
        condition: service_started
      backend-asgi:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  django-static:
  django-media:
